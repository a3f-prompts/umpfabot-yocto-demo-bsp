# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "umpfabot-demo-bsp"
BBFILE_PATTERN_umpfabot-demo-bsp = "^${LAYERDIR}/"
# above oe-core, so our barebox is used instead of the one from oe-core
BBFILE_PRIORITY_umpfabot-demo-bsp = "6"

LAYERDEPENDS_umpfabot-demo-bsp = "core"
LAYERSERIES_COMPAT_umpfabot-demo-bsp = "wrynose"
